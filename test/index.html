<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"> <!-- これが日本語を表示させるための宣言です -->
    <style>
        body {
            background-image: url('bg.jpg'); /* さきほど保存した画像 */
            background-size: cover;
            background-position: center;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Sawarabi Mincho", serif;
        }
        .box {
            background: rgba(255,255,255,0.6);
            padding: 60px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { font-weight: normal; color: #333; letter-spacing: 0.5rem; }
        #word { font-size: 1.4rem; line-height: 2.2; color: #000; min-height: 150px; display: flex; align-items: center; justify-content: center; }
        button {
            margin-top: 20px; padding: 12px 50px;
            background: transparent; border: 1px solid #333;
            cursor: pointer; font-size: 1rem;
        }
        button:hover { background: #333; color: #fff; }
    </style>
</head>
<body>

    <div class="box">
        <h1>老子の智慧</h1>
        <div id="wisdom-display">
            <p id="word">静かに、道（タオ）を感じてください</p>
        </div>
        <button onclick="getWisdom()">教えを乞う</button>
    </div>

    <script>
        const wisdoms = [
            "上善は水のごとし。水は争わず、低い方へと流れる。",
            "足るを知る者は富む。今あるものに満足すれば心は豊かになる。",
            "無為自然。無理に成そうとせず、自然の流れに身を任せなさい。",
            "他人を知る者は知恵があるが、自分を知る者こそが本当に明るい。",
            "千里の道も一歩から。大きなことも、小さな積み重ねから始まる。",
            "大器は晩成す。大きな器は完成するまでに時間がかかるものだ。"
        ];

        function getWisdom() {
            const wordElement = document.getElementById("word");
            const index = Math.floor(Math.random() * wisdoms.length);
            wordElement.innerText = wisdoms[index];
        }
    </script>
</body>
</html>
